hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }

# Convention Plugins
mmoney-android-application = { id = "mmoney.android.application", version = "unspecified" }
mmoney-android-library = { id = "mmoney.android.library", version = "unspecified" }
